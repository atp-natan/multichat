name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Validar sintaxe dos processos principal e preloads
        run: npm run check

      - name: Rodar testes unitários
        run: npm test

      # Popup de novidades: impede taguear uma versão sem entrada no
      # src/whats-new.json (ou com o rascunho de commits ainda marcado como
      # draft). É o mesmo papel do teste que trava a divergência de versão.
      - name: Conferir novidades da versão
        run: npm run whats-new:check
