name: Build and Release

# Dispara ao empurrar uma tag de versão (ex.: v1.6.0) ou manualmente.
# Os pacotes são publicados em um GitHub Release, que é a fonte usada tanto
# pela página pública (docs/index.html) quanto pela checagem de versão do app.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Validar sintaxe
        run: npm run check

      - name: Rodar testes
        run: npm test

      - name: Gerar AppImage e tar.xz
        run: npm run dist:linux -- --publish=never

      - name: Guardar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          if-no-files-found: error
          path: |
            dist/MultiChat-*.AppImage
            dist/*.tar.xz

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Gerar instalador NSIS e zip
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:windows -- --publish=never

      - name: Guardar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          if-no-files-found: error
          path: |
            dist/MultiChat-*-setup.exe
            dist/MultiChat-*-win-*.zip

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      # Assinatura ad-hoc (package.json mac.identity = "-"): o Gatekeeper deixa
      # de chamar o app de "danificado" no Apple Silicon. Sem certificado pago
      # ainda aparece o aviso de desenvolvedor não identificado, que dá para
      # ignorar em Ajustes → Privacidade e Segurança. CSC_IDENTITY_AUTO_DISCOVERY
      # não pode ser false aqui — isso pulava o codesign inteiro.
      - name: Gerar dmg e zip (Intel e Apple Silicon)
        run: |
          unset CSC_LINK || true
          unset CSC_KEY_PASSWORD || true
          npm run dist:mac -- --publish=never

      - name: Conferir assinatura ad-hoc
        run: |
          # codesign -dv imprime "Sealed Resources version=2 …", não "Sealed Resources=yes".
          apps=$(find dist -name 'MultiChat.app' -type d)
          test -n "$apps"
          for app in $apps; do
            echo "== $app =="
            codesign --verify --deep "$app"
            codesign -dv --verbose=4 "$app" 2>&1 | tee /tmp/cs.txt
            grep -q 'Signature=adhoc' /tmp/cs.txt
            grep -E -q 'Sealed Resources version=[0-9]+' /tmp/cs.txt
            if grep -q 'linker-signed' /tmp/cs.txt || grep -q 'Sealed Resources=none' /tmp/cs.txt; then
              echo "Assinatura inválida (linker-signed / sem recursos selados)" >&2
              exit 1
            fi
          done

      - name: Guardar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          if-no-files-found: error
          path: |
            dist/MultiChat-*.dmg
            dist/MultiChat-*-mac*.zip

  release:
    name: Publicar Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Exigir uma tag de versão
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "Este workflow publica releases e só roda em tags no formato v*.*.*."
          echo "Crie e empurre a tag: git tag v1.6.0 && git push origin v1.6.0"
          exit 1

      # A tag é o último portão: sem entrada em src/whats-new.json, o popup de
      # novidades daquela versão simplesmente não apareceria para ninguém.
      # Checkout explícito: os artefatos dos builds vêm por upload/download, e
      # este job não tinha cópia do código até aqui.
      - uses: actions/checkout@v4

      - name: Conferir novidades da versão da tag
        run: npm run whats-new:check

      - name: Baixar todos os artefatos
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Conferir artefatos recebidos
        run: ls -lh dist

      # Checksums SHA-256 publicados junto com os binários, para quem quiser
      # conferir o download antes de instalar.
      - name: Gerar checksums SHA-256
        run: |
          cd dist
          sha256sum MultiChat-* > SHA256SUMS.txt || true
          cat SHA256SUMS.txt

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MultiChat ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          files: |
            dist/MultiChat-*.AppImage
            dist/*.tar.xz
            dist/MultiChat-*-setup.exe
            dist/MultiChat-*-win-*.zip
            dist/MultiChat-*.dmg
            dist/MultiChat-*-mac*.zip
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
